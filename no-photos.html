<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>No Photos</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/> 
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0a2d6e;
      --navy-dark: #061a40;
      --navy-light: #1a4aad;
      --teal: #00c4b4;
      --teal-dim: #009e90;
      --white: #ffffff;
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--navy-dark);
      overflow: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 75% 30%, #083a6e 0%, transparent 55%),
        radial-gradient(ellipse at 25% 70%, #042240 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, #00504a22 0%, transparent 50%),
        #030d22;
    }

    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.2;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb1 { width: 450px; height: 450px; background: #00c4b4; top: -120px; right: -80px; animation-delay: 0s; opacity: 0.1; }
    .orb2 { width: 380px; height: 380px; background: #1a4aad; bottom: -80px; left: -60px; animation-delay: -5s; }
    .orb3 { width: 200px; height: 200px; background: #00c4b4; top: 50%; left: 20%; animation-delay: -9s; opacity: 0.08; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(25px, 18px) scale(1.07); }
    }

    .grid {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    .container {
      position: relative; z-index: 10;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 56px 52px 48px;
      max-width: 520px; width: 100%;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
      animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 88px; height: 88px;
      margin: 0 auto 32px;
      position: relative;
      animation: iconIn 0.9s cubic-bezier(0.22,1,0.36,1) 0.15s both;
    }

    @keyframes iconIn {
      from { opacity: 0; transform: scale(0.5) rotate(15deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .icon-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid var(--teal);
      opacity: 0.5;
      animation: pulse-ring 2.8s ease-in-out infinite;
    }
    .icon-ring2 {
      position: absolute; inset: -12px;
      border-radius: 50%;
      border: 1px solid var(--teal);
      opacity: 0.2;
      animation: pulse-ring 2.8s ease-in-out infinite 0.7s;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.1; }
    }

    .icon-inner {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,196,180,0.15), rgba(0,196,180,0.04));
      border: 1.5px solid rgba(0,196,180,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }

    .label {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 16px;
      animation: fadeUp 0.7s ease 0.3s both;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 20px;
      animation: fadeUp 0.7s ease 0.4s both;
    }

    .message {
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      line-height: 1.7;
      margin-bottom: 40px;
      animation: fadeUp 0.7s ease 0.5s both;
    }

    .message strong {
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-flex;
      align-items: center; gap: 8px;
      background: linear-gradient(135deg, #0f6a64, #0a2d6e);
      border: 1px solid rgba(0,196,180,0.2);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 14px 32px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,100,96,0.4);
      animation: fadeUp 0.7s ease 0.6s both;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,196,180,0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover::before { opacity: 1; }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,100,96,0.6);
      border-color: rgba(0,196,180,0.4);
    }
    .btn:active { transform: translateY(0); }
    .btn-icon { font-size: 16px; transition: transform 0.3s; }
    .btn:hover .btn-icon { transform: translateX(3px); }

    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      margin: 0 auto 24px;
      animation: fadeUp 0.7s ease 0.35s both;
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid"></div>
<canvas id="particles"></canvas>

<div class="container">
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-ring"></div>
      <div class="icon-ring2"></div>
      <div class="icon-inner">🖼️</div>
    </div>
    <div class="label">Photo Folder</div>
    <div class="divider"></div>
    <div class="title">No Photos Available</div>
    <div class="message">
      Sorry, there are <strong>no uploaded photos</strong> for this email.<br/>
      Please let me know if you need any images or supporting documents. <br/>
      Thank you for your patience!
    </div>
    <button class="btn" onclick="window.close(); setTimeout(()=>{ window.location.href='about:blank'; }, 100);">
      <span>Close Page</span>
      <span class="btn-icon">✕</span>
    </button>
  </div>
</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      dx: (Math.random() - 0.5) * 0.3,
      dy: -Math.random() * 0.5 - 0.1,
      alpha: Math.random() * 0.5 + 0.1,
      color: Math.random() > 0.6 ? '#00c4b4' : '#4a7fe8'
    };
  }

  function initParticles() {
    particles = Array.from({ length: 80 }, createParticle);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      p.alpha -= 0.001;
      if (p.y < -5 || p.alpha <= 0) particles[i] = createParticle();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(animateParticles);
  }

  resize();
  initParticles();
  animateParticles();
  window.addEventListener('resize', () => { resize(); initParticles(); });
</script>
</body>
</html>
